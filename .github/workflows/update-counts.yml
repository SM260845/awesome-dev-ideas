name: Update counts

on:
  push:
    branches: [main]
    paths: ["ideas/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the refreshed README counts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 zizmor: ignore[artipacked]
        with:
          persist-credentials: true # needed to push the counts commit; no artifacts are uploaded
      - name: Refresh README counts
        run: python3 scripts/count_entries.py --write
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "Counts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update idea counts"
          git push
